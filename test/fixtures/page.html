<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Jev browser test page</title>
<body>
  <section aria-label="Check-in details">
    <h2>Check-in details</h2>
    <label>Name<input id="name" aria-label="Name"></label>
    <label>Password<input id="password" type="password" aria-label="Password"></label>
    <label><input id="agreement" type="checkbox">I agree to the user agreement</label>
    <label>Guests<select id="people" aria-label="Guests"><option value="1">1 guest</option><option value="2">2 guests</option></select></label>
    <button id="guest-confirm" onclick="document.querySelector('#result').textContent = 'Check-in confirmed'">Confirm</button>
  </section>
  <section aria-label="Invoice details">
    <h2>Invoice details</h2>
    <button id="invoice-confirm" onclick="document.querySelector('#result').textContent = 'Invoice confirmed'">Confirm</button>
  </section>
  <p id="result" role="status" aria-label="Action result">Waiting for action</p>
</body>
</html>
